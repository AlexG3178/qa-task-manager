name: Run Postman API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa-task-manager
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Start backend
        run: |
          cd backend
          pnpm install
          pnpm run build
          pnpm run start:dev &
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qa-task-manager

      - name: Wait for backend to start
        run: |
          echo "Waiting for backend..."
          for i in {1..20}; do
            if curl --silent http://localhost:3000/health > /dev/null; then
              echo "Backend is up!"
              break
            fi
            echo "Still waiting... ($i)"
            sleep 3
          done

      - name: Run Postman tests
        run: |
          pnpm dlx newman run postman/task-manager-api.postman_collection.json \
            -e postman/task.manager_environment.json \
            --reporters cli,html \
            --reporter-html-export newman-report.html

      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v3
        with:
          name: newman-report
          path: newman-report.html
