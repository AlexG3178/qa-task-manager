name: Run Postman API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa-task-manager
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install root dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        working-directory: backend

      - name: Set up and start backend
        run: |
          cd backend
          pnpm install
          pnpm exec prisma generate
          pnpm run build
          pnpm run prod &
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qa-task-manager

      - name: Wait for backend to start
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..20}; do
            if curl --silent http://localhost:3000/health > /dev/null; then
              echo "✅ Backend is up!"
              exit 0
            fi
            echo "⏳ Still waiting... ($i)"
            sleep 3
          done
          echo "❌ Backend failed to start in time."
          exit 1

      - name: Run Postman tests via Newman
        run: |
          pnpm dlx newman run postman/task-manager-api.postman_collection.json \
            -e postman/task.manager_environment.json \
            --reporters cli,html \
            --reporter-html-export newman-report.html

      - name: Install Newman + HTML reporter
        run: |
          pnpm add -g newman newman-reporter-html

      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
